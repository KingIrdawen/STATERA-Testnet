# ─────────────────────────────────────────────────────────────────────────────
# Statera — PPS Snapshot Cron (GitHub Actions)
#
# Appelle POST /api/cron/snapshot-pps toutes les heures pour stocker
# le prix par share (PPS) de chaque vault dans Upstash KV.
# Ces snapshots permettent de calculer le 24h PnL et le 24h Return
# dans le dashboard sans base de données supplémentaire.
#
# ─── Secrets à configurer dans GitHub (Settings → Secrets → Actions) ─────────
#   VERCEL_APP_URL : URL complète de l'app (ex: https://statera-testnet.vercel.app)
#   CRON_SECRET    : valeur aléatoire — doit correspondre à la var CRON_SECRET sur Vercel
#
# ─── Portabilité mainnet ──────────────────────────────────────────────────────
# Pour le mainnet (VPS, Railway, etc.) :
#   - Mettre à jour VERCEL_APP_URL vers l'URL de production
#   - Ou remplacer ce workflow par un cron systemd/pm2 sur le serveur
#   - L'endpoint /api/cron/snapshot-pps est identique quelle que soit l'infra
# ─────────────────────────────────────────────────────────────────────────────

name: PPS Snapshot

on:
  schedule:
    - cron: '0 * * * *'   # Toutes les heures (minuit, 1h, 2h, ...)
  workflow_dispatch:        # Déclenchement manuel depuis l'onglet Actions

jobs:
  snapshot:
    name: Snapshot PPS for all vaults
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call snapshot endpoint
        run: |
          APP_URL="${{ secrets.VERCEL_APP_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          # Si les secrets ne sont pas configurés, on skip sans erreur
          if [ -z "$APP_URL" ]; then
            echo "⚠️  VERCEL_APP_URL non configuré — snapshot ignoré"
            echo "Configure ce secret dans : GitHub → Settings → Secrets → Actions"
            exit 0
          fi

          echo "Triggering PPS snapshot at $(date -u)"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${APP_URL}/api/cron/snapshot-pps" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 30)

          BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Snapshot failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "✅ Snapshot successful"
